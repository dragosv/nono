# Throwaway spike: launch under PSEC by calling processmodel.dll directly,
# without the mxc-sdk dependency. Not a workspace member; not for merge.
[package]
name = "windows-psec-direct"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Runtime for the vendored PSEC bindings (generated by flatc 25.12.19).
flatbuffers = "=25.12.19"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[workspace]
